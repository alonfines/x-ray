# Exp046 — PRE-REGISTERED clusters. Confirmed by Alon, 2026-10-28, before any run.
#
# Four clusters spanning m = 2, 3, 3, 5 and a range of hard-constraint counts
# (1, 2, 0, 4), so the structure-dependent effects are separable from m.
# Fixed: no partition search, no post-hoc additions. Clusters must be m = 2..5;
# labels are the exact CSV label names.
alpha: 0.1

clusters:
  cardio_pair:
    labels: [Enlarged Cardiomediastinum, Cardiomegaly]
    note: hierarchy parent-child pair, m=2, one hard constraint

  lung_core:
    labels: [Lung Opacity, Edema, Consolidation]
    note: m=3, two hard constraints (both children of Lung Opacity)

  pleural_free:
    labels: [Pneumothorax, Pleural Effusion, Support Devices]
    note: m=3, no hierarchy constraints — the "no structure" control

  lung_wide:
    labels: [Lung Opacity, Edema, Consolidation, Pneumonia, Atelectasis]
    note: m=5, four hard constraints
