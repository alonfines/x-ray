experiment_name: "baseline"

# Dataset selection: "chexpert" or "mimic"
dataset: "chexpert"

# Which pathologies to classify
# "all" = all 13 CheXpert labels (excluding No Finding), with No Finding preprocessing
# or list specific labels:
labels: "all"
#labels:
#  - Atelectasis
#  - Cardiomegaly
#  - Consolidation
#  - Pleural Effusion
#  - Pneumothorax

# Loss configuration
# type: "bce" (BCEWithLogitsLoss, default) or "auc_margin" (AUC Margin Loss from Yuan et al. 2021)
loss:
  type: "auc_margin"
  auc_margin:
    margin: 1.0 # margin parameter m (paper tunes from {0.3, 0.5, 0.7, 1.0})
    pretrained_checkpoint: "checkpoints/densenet-alllabels-bce-epoch=39-val_auroc_mean=0.774.ckpt"  # BCE checkpoint for two-stage training (null to train from scratch)
    reinit_classifier: true  # reinitialize classifier head before AUC fine-tuning (paper recommendation)

# Data paths
data:
  working_dir: "/gpfs0/tamyr/users/alonfi/XRay"
  chexpert_dir: "/gpfs0/tamyr/projects/data/chest_xray/chexpert"
  train_split_csv: "csv_files/chexpert/train_split.csv"
  valid_split_csv: "csv_files/chexpert/valid_split.csv"
  conformal_split_csv: "csv_files/chexpert/conformal_split.csv"
  test_split_csv: "csv_files/chexpert/test_split.csv"

  # Stratified split ratios (for CheXpert: combines train.csv + valid.csv)
  split_ratios:
    train: 0.70      # 70% for training
    validation: 0.10 # 10% for validation (early stopping)
    conformal: 0.10  # 10% for conformal calibration
    test: 0.10       # 10% for final test evaluation

# MIMIC-CXR-JPG data paths
mimic:
  data_dir: "/gpfs0/tamyr/projects/data/MIMIC-CXR"
  files_dir: "/gpfs0/tamyr/projects/data/MIMIC-CXR/files"
  metadata_csv: "/gpfs0/tamyr/projects/data/MIMIC-CXR/csv/mimic-cxr-2.0.0-metadata.csv"
  chexpert_csv: "/gpfs0/tamyr/projects/data/MIMIC-CXR/csv/mimic-cxr-2.0.0-chexpert.csv"
  test_labels_csv: "/gpfs0/tamyr/projects/data/MIMIC-CXR/csv/mimic-cxr-2.1.0-test-set-labeled.csv"
  views: ["AP", "PA"]  # Frontal views only
  train_split_csv: "csv_files/mimic/train_split.csv"
  valid_split_csv: "csv_files/mimic/valid_split.csv"
  conformal_split_csv: "csv_files/mimic/conformal_split.csv"
  test_split_csv: "csv_files/mimic/test_split.csv"
  split_ratios:
    train: 0.70
    validation: 0.10
    conformal: 0.10
    test: 0.10

# Training dataloader settings
training:
  batch_size: 32
  num_workers: 16
  task_weights: # calculated from the new training set (70/10/10/10 split)
    - 2.242 # Atelectasis
    - 3.040 # Cardiomegaly
    - 8.464 # Consolidation
    - 1.742 # Pleural Effusion
    - 6.383 # Pneumothorax

# Optimizer
optimizer:
  lr: 0.001
  min_lr: 1e-6
  w_decay: 0.05

# Lightning Trainer configuration
trainer:
  fast_dev_run: False
  max_epochs: 150
  precision: 'bf16-mixed'
  accelerator: "gpu"
  devices: "auto"
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: "cxr_uda"
      name: "baseline_run"
      tags:
        - baseline
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: "val_auroc_mean"
        patience: 30
        mode: "max"
        verbose: True
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: 'epoch'

# Checkpoint configuration
chkpt_callback:
  monitor: "val_auroc_mean"
  mode: "max"
  save_top_k: 1
  dirpath: "/gpfs0/tamyr/users/alonfi/XRay/checkpoints"
  filename: "densenet-{epoch:02d}-{val_auroc_mean:.3f}"

# Conformal prediction configuration
conformal:
  alpha: 0.1 # 1 - alpha = 0.9 (90% confidence level)
  use_weights: false  # Enable weighted conformal prediction (balances coverage across imbalanced classes)
  weighting_scheme: "uniform"  # "inverse_prevalence" (weight rare classes higher) or "uniform"
  calibration_dir: "/gpfs0/tamyr/users/alonfi/XRay/conformal_calibration"
  q_hat_file: "/gpfs0/tamyr/users/alonfi/XRay/conformal_calibration/q_hat.pt"

# Evaluation (for test.py and conformal calibration)
evaluation:
  checkpoint_path: "/gpfs0/tamyr/users/alonfi/XRay/checkpoints/densenet-alllabels-bce-epoch=39-val_auroc_mean=0.774.ckpt" # specific checkpoint to load (null = latest from checkpoints dir)
  checkpoint_dir: "/gpfs0/tamyr/users/alonfi/XRay/checkpoints"  # fallback: scan for latest checkpoint

# Output paths
output:
  log_dir: "/gpfs0/tamyr/users/alonfi/XRay/logs"
  results_csv: "csv_files/chexpert/results.csv"  # CSV output relative to working_dir
